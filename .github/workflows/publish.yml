name: Publish package

# Publishes @temporalio-web/consent-banner to the PUBLIC npm registry when a
# GitHub Release is published. Cutting the Release (from a vX.Y.Z tag) is the
# deliberate, human step; this workflow reacts to it — merging a PR does NOT
# publish.
#
# Auth is OIDC TRUSTED PUBLISHING — no npm token is stored. npmjs.com must have a
# trusted publisher configured for this package: org `temporalio`, repository
# `consent-banner`, workflow filename `publish.yml`. The `repository.url` in
# package.json must exactly match the GitHub repo, and the repo must be PUBLIC.
#
# Provenance is generated AUTOMATICALLY under trusted publishing from a public
# repo + public package (no --provenance flag needed).
#
# Before publishing: bump "version" in package.json, tag it (vX.Y.Z), and draft a
# Release for that tag. npm refuses to republish an existing version, so the
# version bump gates every publish.
#
# workflow_dispatch is a manual fallback (Actions tab -> Run workflow). Note that
# release-triggered runs resolve the workflow from the RELEASE TAG's commit, so a
# tag pushed before this file existed won't auto-run — dispatch it from a branch
# that has the workflow instead.
on:
  release:
    types: [published]
  workflow_dispatch:

# id-token: write is REQUIRED for OIDC trusted publishing (and the automatic
# provenance attestation). No packages:write / npm token — OIDC replaces both.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js for the public npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # No dependency cache: npm advises against caching in release builds.
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI >= 11.5.1; Node's bundled npm may be older.
      - name: Ensure an OIDC-capable npm CLI
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build the distributable output
        run: pnpm build

      # Publish with the npm CLI (not pnpm) for first-class OIDC trusted-publishing
      # + automatic provenance. access:public comes from package.json publishConfig.
      # No NODE_AUTH_TOKEN — npm detects the GitHub Actions OIDC environment.
      - name: Publish to npm (OIDC trusted publishing + provenance)
        run: npm publish
